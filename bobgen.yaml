sqlite:
  dsn: "./tmp/ape.db"
  except:
    schema_migrations:
    sessions:

plugins:
  dbinfo:
    disabled: true
    pkgname: "dbinfo"
    destination: "./pkg/gen/bob/dbinfo"
  enums:
    disabled: false
    pkgname: "enums"
    destination: "./pkg/gen/bob/enums"
  models:
    disabled: false
    pkgname: "models"
    destination: "./pkg/gen/bob/models"
  factory:
    disabled: true
    pkgname: "factory"
    destination: "./pkg/gen/bob/factory"
  dberrors:
    disabled: false
    pkgname: "dberrors"
    destination: "./pkg/gen/bob/dberrors"
  where:
    disabled: false
  loaders:
    disabled: false
  joins:
    disabled: false
